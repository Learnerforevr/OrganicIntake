# =========================================================
# APPLICATION CONFIGURATION
# =========================================================
spring.application.name=farmer-profile
server.port=8082

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# =========================================================
# MYSQL DATASOURCE CONFIGURATION (EXTERNALIZED SECRETS)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# =========================================================
# JPA & HIBERNATE SETTINGS
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

spring.jpa.open-in-view=false

# =========================================================
# LOGGING
# =========================================================
logging.level.com.example.farmerprofile=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE