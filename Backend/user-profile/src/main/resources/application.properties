# =========================================================
# APPLICATION CONFIGURATION
# =========================================================
spring.application.name=user-profile
server.port=8080

# Java 21 Virtual Threads (High-throughput I/O)
spring.threads.virtual.enabled=true

# =========================================================
# MYSQL DATASOURCE CONFIGURATION
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/organic_intake_user_profile_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Welcome@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (Enterprise standard)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# =========================================================
# JPA & HIBERNATE SETTINGS
# =========================================================
# 'update' creates/updates tables automatically in dev; change to 'validate' or 'none' for production
spring.jpa.hibernate.ddl-auto=update

# Explicit MySQL 8+ Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Formatting & SQL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Prevent Hibernate from generating separate queries when fetching lazy associations unnecessarily
spring.jpa.open-in-view=false

# =========================================================
# ACTUATOR & LOGGING
# =========================================================
logging.level.com.example.userprofile=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
